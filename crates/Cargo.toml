# The Rust workspace: a virtual root so one Cargo.lock pins every crate under crates/ together. The binding
# crate `bc-file-system` compiles the C core from ../core through `cc` and is the Rust face; its companion
# `bc-file-system-testing` holds what a consumer's tests need and production never sees (the observed engine and a
# temporary directory). Nothing here is published: consumers pin a git SHA (design doc, "Faces and their
# compositions"; plan Decision mine-7), because the C sources sit outside the crate directory and `cargo package`
# cannot reach them.
[workspace]
members = ["bc-file-system", "bc-file-system-testing"]
# The edition-2024 resolver, which resolves with the declared `rust-version` in view.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# bc-mutants' MSRV, the first Rust consumer this crate is cut for; the design doc names no Rust floor of its own.
rust-version = "1.89"
publish = false
license = "Apache-2.0"
