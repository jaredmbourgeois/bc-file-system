name: CI

# Branches only: a tag names a commit that a branch push has already built.
on:
  push:
    branches: ['**']
  pull_request:
  # A manual run from the Actions tab, for a commit pushed before Actions was enabled on the repository.
  workflow_dispatch:

# Every job is one leg of scripts/verify.sh (its name is the leg's name), so "green locally" and "green in CI"
# cannot drift; the workflow chooses the compiler and nothing else. The runner is Debian 13 with GCC 14,
# clang 19, Swift 6.4, CMake, Ninja and Python 3 on PATH; the jobs install nothing but the Rust toolchain the
# `rust` job pins through rustup (the shape bc-plumb's workflow uses on the same runner). The one other thing
# fetched is GoogleTest, by CMake, pinned to a commit.
#
# Not here yet, gated on workstation `ci-forgejo-runner-posture` stage `bc-file-system-job-packages` (the runner
# has no musl, NDK or Emscripten): the NDK compile legs at API 30, 33 and 35; Emscripten (MEMFS and NODERAWFS
# under Node); x86_64 musl native and aarch64 musl under qemu-user-static, for the C build and for `cargo test`
# (the crate's binding suite and ABI round trips, run where the target's ABI is) on the two musl targets
# `x86_64-unknown-linux-musl` (musl-gcc from musl-tools) and
# `aarch64-unknown-linux-musl` (clang-19 `--target=aarch64-linux-musl` over musl-dev:arm64 headers, named per
# target through CC_<triple>; no cargo-zigbuild on the Mac either); memory-sanitized; build-clang's sanitized
# leg (clang-19's compiler-rt, libclang-rt-19-dev: without it the sanitized link fails on libclang_rt.asan*.a);
# and the `fuzz-smoke` leg (libFuzzer is in that same compiler-rt package; its three targets are
# bc_file_system_path_fuzz, bc_file_system_abi_arguments_fuzz and bc_file_system_operation_sequence_fuzz), which
# runs on the Mac by hand (`bash scripts/verify.sh fuzz-smoke`) until then. Each lands as its own job when its packages do. The wasm32
# freestanding compile of the path module needs no package: clang-19 has the target, so the path-freestanding
# job below runs under it.
jobs:
  build-gcc:
    runs-on: debian-13
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh build-debug build-sanitized

  build-clang:
    runs-on: debian-13
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh build-debug

  header-four-ways:
    runs-on: debian-13
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh header-four-ways

  path-freestanding:
    runs-on: debian-13
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh path-freestanding

  guards:
    runs-on: debian-13
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh guards

  swift:
    runs-on: debian-13
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh swift

  consumer:
    runs-on: debian-13
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh consumer

  # The Rust workspace (`bc-file-system` and `bc-file-system-testing`), on the MSRV and one pinned stable, never
  # the moving channel, so a push is red only for what it changed; the pin moves in one commit with that release's
  # lint fixes. RUSTUP_TOOLCHAIN takes precedence over the root's rust-toolchain.toml (the MSRV, for local builds),
  # so each leg runs its own compiler. The leg is fmt, clippy, the tests and rustdoc under -D warnings. The build
  # script compiles the C core with the runner's `cc` (GCC 14), the way a Rust consumer on this host would.
  rust:
    runs-on: debian-13
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", "1.98.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Cache cargo
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/target
          key: cargo-${{ matrix.rust }}-${{ hashFiles('crates/Cargo.lock') }}
          # A leg with no cache of its own (a pinned stable just bumped) starts from the MSRV leg's: the
          # registry carries over, and cargo rebuilds what another compiler built.
          restore-keys: |
            cargo-${{ matrix.rust }}-
            cargo-1.89.0-
      - run: bash scripts/verify.sh rust
